<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Flyout Builds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">My Flyout Builds</h1>

  <div class="project-grid">

    <div class="project-button">
      <img src="assets/images/project1.png" class="project-img" alt="Project 1">
      <span class="project-title">"MF-21 Eclipse"</span>
      <span class="project-desc">A gen 4.5 multirole delta canard (OLD).</span>
    </div>

    <div class="project-button">
      <img src="assets/images/project2.png" class="project-img" alt="Project 2">
      <span class="project-title">LF-27 "Longsword"</span>
      <span class="project-desc">A gen 5 lightweight stealth fighter.</span>
    </div>

    <div class="project-button">
      <img src="assets/images/project3.png" class="project-img" alt="Project 3">
      <span class="project-title">Bo's Plane</span>
      <span class="project-desc">A plane built by me beloved cat, Bo.</span>
    </div>

    <div class="project-button">
      <img src="assets/images/project4.png" class="project-img" alt="Project 4">
      <span class="project-title">AT-47 "Mantis" (BROKEN)</span>
      <span class="project-desc">Original Ornithopter Project</span>
    </div>

  </div>

</body>
</html>
